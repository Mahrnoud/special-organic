<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organic Special — Admin Dashboard</title>

  <script src="assets/js/boot.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/img/logo.png">
</head>
<body class="admin-shell">

  <nav class="admin-topbar navbar py-2">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <img src="assets/img/logo.png" class="os-logo-mark" alt="Organic Special">
        <span class="brand-name" data-i18n="dashboard_title">Orders</span>
      </div>
      <button type="button" class="btn btn-outline-light btn-sm rounded-pill px-3" id="logoutBtn">
        <i class="bi bi-box-arrow-right me-1"></i>
        <span data-i18n="logout">Log out</span>
      </button>
    </div>
  </nav>

  <main class="container py-4">
    <!-- Stat tiles -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-2">
        <div class="stat-tile">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label" data-i18n="total_orders">Total orders</div>
        </div>
      </div>
      <div class="col-6 col-md-2">
        <div class="stat-tile">
          <div class="stat-value" id="statPending">0</div>
          <div class="stat-label" data-i18n="pending_orders">Pending</div>
        </div>
      </div>
      <div class="col-6 col-md-2">
        <div class="stat-tile">
          <div class="stat-value" id="statConfirmed">0</div>
          <div class="stat-label" data-i18n="confirmed_orders">Confirmed</div>
        </div>
      </div>
      <div class="col-6 col-md-2">
        <div class="stat-tile">
          <div class="stat-value" id="statShipped">0</div>
          <div class="stat-label" data-i18n="shipped_orders">Shipped</div>
        </div>
      </div>
      <div class="col-6 col-md-2">
        <div class="stat-tile">
          <div class="stat-value" id="statDelivered">0</div>
          <div class="stat-label" data-i18n="delivered_orders">Delivered</div>
        </div>
      </div>
      <div class="col-6 col-md-2">
        <div class="stat-tile">
          <div class="stat-value" id="statReturned">0</div>
          <div class="stat-label" data-i18n="returned_orders">Returned</div>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="row g-2 mb-3 align-items-end">
      <div class="col-6 col-md-2">
        <label class="form-label small" data-i18n="filter_country">Country</label>
        <select class="form-select" id="filterCountry">
          <option value="" data-i18n="all_categories">All</option>
          <option value="Egypt" data-i18n="egypt">Egypt</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small" data-i18n="filter_city">City</label>
        <select class="form-select" id="filterCity">
          <option value="" data-i18n="all_cities">All cities</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small" data-i18n="filter_status">Status</label>
        <select class="form-select" id="filterStatus">
          <option value="" data-i18n="all_statuses">All statuses</option>
          <option value="pending" data-i18n="status_pending">Pending</option>
          <option value="confirmed" data-i18n="status_confirmed">Confirmed</option>
          <option value="shipped" data-i18n="status_shipped">Shipped</option>
          <option value="delivered" data-i18n="status_delivered">Delivered</option>
          <option value="returned" data-i18n="status_returned">Returned</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small" data-i18n="date_from">From</label>
        <input type="date" class="form-control" id="filterDateFrom">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small" data-i18n="date_to">To</label>
        <input type="date" class="form-control" id="filterDateTo">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small" data-i18n="search_by_id">Search by order ID</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-hash"></i></span>
          <input type="text" class="form-control" id="searchOrderId" inputmode="numeric">
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between flex-wrap gap-2 mb-3">
      <button type="button" class="btn btn-outline-forest" id="clearFiltersBtn">
        <i class="bi bi-x-circle me-1"></i><span data-i18n="clear_filters">Clear</span>
      </button>
      <button type="button" class="btn btn-forest" id="exportExcelBtn">
        <i class="bi bi-file-earmark-excel me-1"></i><span data-i18n="export_excel">Export to Excel</span>
      </button>
    </div>

    <!-- Orders table -->
    <div class="table-responsive">
      <table class="table orders-table align-middle bg-white">
        <thead>
          <tr>
            <th data-i18n="order_id_col">Order #</th>
            <th data-i18n="customer_col">Customer</th>
            <th data-i18n="city_col">City</th>
            <th data-i18n="mobile_col">Mobile</th>
            <th data-i18n="total_col">Total</th>
            <th data-i18n="status_col">Status</th>
            <th data-i18n="date_col">Date</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>

    <div id="noOrdersMsg" class="text-center text-muted-soft py-5 d-none">
      <i class="bi bi-inbox fs-1"></i>
      <p class="mt-2" data-i18n="no_orders_found">No orders match your filters.</p>
    </div>
    <div id="loadingMsg" class="text-center text-muted-soft py-5">
      <div class="spinner-border text-forest"></div>
    </div>
  </main>

  <!-- Order details modal -->
  <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <span data-i18n="order_details_title">Order details</span>
            <span id="detailsOrderId" class="text-forest"></span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row mb-3">
            <div class="col-md-6 mb-2">
              <div class="text-muted-soft small" data-i18n="customer_col">Customer</div>
              <div class="fw-bold" id="detailsName"></div>
            </div>
            <div class="col-md-6 mb-2">
              <div class="text-muted-soft small" data-i18n="date_col">Date</div>
              <div class="fw-bold" id="detailsDate"></div>
            </div>
            <div class="col-md-6 mb-2">
              <div class="text-muted-soft small" data-i18n="city_col">City</div>
              <div class="fw-bold" id="detailsCity"></div>
            </div>
            <div class="col-md-6 mb-2">
              <div class="text-muted-soft small" data-i18n="status_col">Status</div>
              <select class="form-select form-select-sm status-select" id="detailsStatusSelect"></select>
            </div>
            <div class="col-md-6 mb-2">
              <div class="text-muted-soft small" data-i18n="mobile_whatsapp">Mobile number (WhatsApp)</div>
              <div class="fw-bold" id="detailsMobile"></div>
            </div>
            <div class="col-md-6 mb-2">
              <div class="text-muted-soft small" data-i18n="mobile_additional">Additional number</div>
              <div class="fw-bold" id="detailsMobileAlt"></div>
            </div>
          </div>
          <hr class="divider-sand">
          <h6 class="mb-2" data-i18n="items_ordered">Items ordered</h6>
          <ul class="list-group" id="detailsItems"></ul>
          <div class="text-end mt-3">
            <span class="text-muted-soft" data-i18n="subtotal">Subtotal</span>:
            <span class="fw-bold fs-5 text-forest" id="detailsTotal"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/egypt-cities.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
