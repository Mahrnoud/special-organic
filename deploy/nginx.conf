server {
    listen 80;
    listen [::]:80;
    server_name special-organic.com www.special-organic.com;
    location ^~ /.well-known/acme-challenge/ {
        root /home/special_organic/acme;
    }
    location / {
        return 301 https://special-organic.com$request_uri;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.special-organic.com;
    ssl_certificate /etc/letsencrypt/live/special-organic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/special-organic.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://special-organic.com$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name special-organic.com;
    ssl_certificate /etc/letsencrypt/live/special-organic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/special-organic.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    access_log /var/log/nginx/special-organic.access.log;
    error_log /var/log/nginx/special-organic.error.log;
    location ~ (^|/)\. { deny all; }
    location ~ ^/(database|backups|deploy|tests|tools)(/|$) { deny all; }
    # Canonical page URLs; query strings are retained by these redirects.
    location = /index.html { return 301 /$is_args$args; }
    location = /index { return 301 /$is_args$args; }
    location = /index/ { return 301 /$is_args$args; }
    location ~ ^/(home|cart|admin-login|admin-dashboard)(?:\.html|/)$ {
        return 301 /$1$is_args$args;
    }
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
