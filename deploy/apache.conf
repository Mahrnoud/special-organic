ServerName special-organic.com
ServerTokens Prod
ServerSignature Off
<VirtualHost *:8080>
    DocumentRoot /var/www/html
    DirectoryIndex index.html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    <Directory /var/www/html>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
    <LocationMatch "(^|/)\.">
        Require all denied
    </LocationMatch>
    <LocationMatch "^/(database|backups|deploy|tests|tools)(/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "\.(db|sqlite|sqlite3|sql|bak|ini|log)$">
        Require all denied
    </FilesMatch>
    <Directory /var/www/html/assets/img/uploads>
        php_admin_flag engine off
        <FilesMatch "\.(php[0-9]*|phtml|phar|cgi|pl|sh)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <Location /api/>
        Header always set Cache-Control "no-store"
    </Location>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
